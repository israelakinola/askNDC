<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskNDC — Question Log</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #141a26;
      --surface-2: #1b2333;
      --text: #e7ebf3;
      --muted: #8b93a7;
      --primary: #3b82f6;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .q {
      font-weight: 700;
      font-size: 16px;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .ts { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .body { font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
    .refs { font-size: 12px; color: var(--muted); }
    .refs a { color: var(--primary); text-decoration: none; }
    .refs a:hover { text-decoration: underline; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  </style>
</head>
<body>
  <h1>Question Log</h1>
  <div class="sub">Every question asked and its answer</div>
  <div id="list"></div>

  <script>
    async function load() {
      const list = document.getElementById("list");
      try {
        const res = await fetch("/questions");
        const questions = await res.json();
        if (!questions.length) {
          list.innerHTML = '<div class="empty">No questions yet</div>';
          return;
        }
        list.innerHTML = questions.map((item) => `
          <div class="card">
            <div class="q">${escapeHtml(item.question)}</div>
            <div class="ts">${new Date(item.timestamp).toLocaleString()}</div>
            <div class="title">${escapeHtml(item.answer.Title)}</div>
            <div class="body">${escapeHtml(item.answer.Body)}</div>
            <div class="refs">
              ${(item.answer.References || []).map(r =>
                `<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a>`
              ).join(" · ")}
            </div>
          </div>
        `).join("");
      } catch (err) {
        list.innerHTML = '<div class="empty">Error loading questions</div>';
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    load();
  </script>
</body>
</html>
