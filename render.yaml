services:
  - type: web
    name: askndc
    env: node
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PORT
        value: "3000"